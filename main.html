<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NML Draft</title>

<!-- All styling lives in css/style.css (fonts, colors, layout, animations). -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- PAGE STRUCTURE
     Only the header, score bar, setlist and chemistry log are written here.
     Everything inside #game-area is generated by js/game.js as you play. -->
<div class="wrap">
  <div class="eyebrow">a game of unnatural selection</div>
  <h1 class="title">NML<br>DRAFT</h1>
  <div class="subtitle">Basically fantasy football, but for musicians, and you don't get anything out of it.</div>

  <!-- Running score + breakdown (e.g. "135 fit, +40 chemistry"), updated by renderScorebar() -->
  <div class="scorebar"><span class="label">Score</span><span class="value" id="score-value">0</span><span class="maxval" id="score-breakdown">0 fit</span></div>

  <!-- Row of slot tickets, filled in by renderSetlist() -->
  <div class="setlist" id="setlist"></div>

  <!-- Chemistry entries (friends / clashes / feuds), filled in by renderClashLog() -->
  <div class="clashlog" id="clashlog"></div>

  <!-- The band card, the final poster, etc. are rendered here -->
  <div id="game-area"></div>
</div>

<button class="btn" id="restart-btn">Restart</button>
<button class="btn" id="rules-btn">Rules</button>
<button class="btn" id="wildcard-needed-btn">Press this to turn off the wildcard role</button>
<label class="bet-amount">Bet Amount: <input type="number" id="bet-number" value="1000" min="100"></label>
<label class="money-amount">Money: <span id="money-amount">1000</span></label>
<button class="btn" id="add-to-bet-btn">Add to Bet</button>
<label class="add-to-bet-amount">Current Bet: <span id="current-bet">0</span></label>
<!-- SCRIPTS: ORDER MATTERS. Data files first, gameg logic last.
     (Plain <script> tags are used instead of ES modules so the game still
     works when you just double-click index.html, with no web server.) -->
<script src="js/bands.js"></script>   <!-- the band list: edit this to add bands -->
<script src="js/rules.js"></script>   <!-- chemistry rules: clashes, friends, feuds -->
<script src="js/game.js"></script>    <!-- the game itself -->
</body>
</html>
