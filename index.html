<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NML Draft Home</title>
   
<link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="btn" id="start-game-btn" href="./main.html" value="off">Start Game</a>
    <label class="bet-amount">Bet Amount: <input type="number" id="bet-number" value="100" min="100"></label>
    <label class="money-amount">Money: <span id="money-amount">1000</span></label>
    <button class="btn" id="add-to-bet-btn">Add to Bet</button>
    <label class="add-to-bet-amount">Current Bet: <span id="current-bet">0</span></label>
    <script src="./js/home.js"></script>
</body>
</html>
